<!--
  HOW TO RUN:
  1. Sync latest messages:
       cd ~/drinks && python3 scripts/sync_messages.py
  2. Start the API:
       cd ~/drinks && source venv/bin/activate && uvicorn api.main:app --reload
  3. Open in your browser (must be served by the API, NOT file://):
       http://localhost:8000/ui/messages-notes.html

  R&D COPY of messages.html: group messages (photos + count texts) and attach
  notes. Groups live in data/annotations.db via /groups — never in messages.db.
    - "Annotate" (or press A) → click messages to select, shift-click for a range
    - Group → creates a group with an optional note; the note card renders
      after the group's last message. Edit / add selected / ungroup from the card.

  ONE-TIME / RECOVERY COMMANDS:
    python3 scripts/sync_messages.py --backfill             # re-sync full history
    python3 scripts/sync_messages.py --fix-text             # recover missing message text
    python3 scripts/sync_messages.py --fix-attachments      # copy missing photos/videos
    python3 scripts/sync_messages.py --rebuild-attachments  # recover ALL photos per message (multi-photo messages)
    python3 scripts/sync_messages.py --fix-heic             # convert HEIC photos to JPEG
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Beer at a Time · Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: #1c1c1e;
    }

    /* Sidebar */
    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #fff;
      border-right: 1px solid #e5e5ea;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar h2 {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 16px 14px 8px;
    }

    .person-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px;
      cursor: pointer;
      border-radius: 8px;
      margin: 1px 6px;
      font-size: 14px;
      transition: background .1s;
    }
    .person-item:hover { background: #f2f2f7; }
    .person-item.active { background: #e8f0fe; font-weight: 600; }

    .person-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #toolbar h1 {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }

    #search {
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 14px;
      width: 220px;
      outline: none;
      background: #f2f2f7;
    }
    #search:focus { border-color: #0B84FE; background: #fff; }

    #chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Load older */
    #load-older {
      text-align: center;
      padding: 10px 0 6px;
    }
    #load-older button {
      background: none;
      border: 1px solid #d1d1d6;
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 13px;
      color: #0B84FE;
      cursor: pointer;
    }
    #load-older button:hover { background: #f2f2f7; }
    #load-older.hidden { display: none; }

    /* Date separator */
    .date-sep {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin: 12px 0 6px;
    }

    /* Message row */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      max-width: 75%;
    }
    .msg-row.from-me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.from-them {
      align-self: flex-start;
    }

    /* Avatar */
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .avatar.hidden { visibility: hidden; }

    /* Bubble */
    .bubble-wrap {
      display: flex;
      flex-direction: column;
    }
    .msg-row.from-me .bubble-wrap { align-items: flex-end; }
    .msg-row.from-them .bubble-wrap { align-items: flex-start; }

    .sender-name {
      font-size: 11px;
      color: #8e8e93;
      margin-bottom: 2px;
      padding-left: 2px;
    }

    .bubble {
      padding: 8px 12px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      max-width: 100%;
    }
    .msg-row.from-them .bubble {
      background: #e9e9eb;
      color: #1c1c1e;
      border-radius: 18px 18px 18px 4px;
    }
    .msg-row.from-me .bubble {
      background: #0B84FE;
      color: #fff;
      border-radius: 18px 18px 4px 18px;
    }

    .bubble img,
    .bubble video {
      display: block;
      max-width: 240px;
      max-height: 320px;
      border-radius: 10px;
      cursor: pointer;
      object-fit: cover;
    }
    .bubble video { cursor: default; }

    /* Multiple photos/videos in one message → compact grid */
    .attachment-gallery.multi {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      max-width: 246px;
    }
    .attachment-gallery.multi img,
    .attachment-gallery.multi video {
      width: 100%;
      max-width: none;
      height: 120px;
      border-radius: 6px;
    }
    .attachment-gallery + .bubble-text { margin-top: 6px; }

    .attachment-placeholder {
      font-style: italic;
      opacity: .7;
    }

    .bubble-time {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 3px;
      padding: 0 2px;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 1000;
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; }

    #status {
      text-align: center;
      padding: 20px;
      color: #8e8e93;
      font-size: 14px;
    }

    #chat-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
    }

    .chat-tab {
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #d1d1d6;
      color: #3c3c43;
      background: none;
      transition: background .1s;
    }
    .chat-tab:hover { background: #f2f2f7; }
    .chat-tab.active { background: #0B84FE; color: #fff; border-color: #0B84FE; }

    /* ── Annotate: lines, selection, groups, notes ─────────────────────── */
    .line {
      display: grid; grid-template-columns: minmax(0, 1fr) var(--note-w); column-gap: var(--note-gap);
      padding: 1px 6px; border-left: 3px solid transparent; border-radius: 4px;
    }
    .line-msg { display: flex; flex-direction: column; min-width: 0; }
    .line-note { min-width: 0; }
    .line.in-group { border-left-color: var(--g); background: color-mix(in srgb, var(--g) 7%, transparent); }
    .line-msg .msg-row.from-me { align-self: flex-end; }
    .line-msg .msg-row.from-them { align-self: flex-start; }
    /* fixed-size photo boxes: lazy loads no longer push content around */
    .line .attachment-gallery:not(.multi) img { width: 240px; height: 320px; object-fit: cover; background: #e5e5ea; }
    .line .attachment-gallery.multi img { background: #e5e5ea; }
    .note-card .lnk.add-sel { display: none; }
    body.has-selection .note-card .lnk.add-sel { display: inline; }
    body.annotating .line { cursor: pointer; }
    body.annotating .line:hover { background: rgba(11,132,254,.06); }
    body.annotating .line .bubble img { pointer-events: none; }
    .line.selected .bubble { box-shadow: 0 0 0 3px #0B84FE; }
    .line.selected { background: rgba(11,132,254,.10) !important; }
    .group-tag {
      font-size: 10px; font-weight: 700; color: #fff; background: var(--g);
      border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px;
    }

    /* Notes sit in the right-hand cell of their group's first message row, in
       normal flow: no absolute positioning, so nothing re-lays-out or jumps. */
    :root { --note-w: 300px; --note-gap: 24px; }
    @media (max-width: 1000px) { :root { --note-w: 210px; --note-gap: 16px; } }
    .note-card {
      margin: 2px 0 6px;
      background: #fffbea;
      border: 1px solid #f0e2a8;
      border-left: 4px solid var(--g);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
      cursor: default;
    }
    .note-card.flash { animation: flash 1.2s ease; }
    @keyframes flash { 0%,40% { box-shadow: 0 0 0 4px var(--g); } 100% { box-shadow: 0 1px 2px rgba(0,0,0,.05); } }
    .note-head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8a7a3a; margin-bottom: 4px; }
    .note-head .spacer { flex: 1; }
    .note-body { white-space: pre-wrap; color: #3a3320; line-height: 1.4; }
    .note-body.empty { color: #b3a672; font-style: italic; }
    .note-card textarea, #actionbar textarea {
      width: 100%; min-height: 60px; font: inherit; font-size: 14px; padding: 6px 8px;
      border: 1px solid #d1d1d6; border-radius: 8px; resize: vertical; outline: none;
    }
    .note-card textarea:focus, #actionbar textarea:focus { border-color: #0B84FE; }
    .lnk { background: none; border: none; color: #0B84FE; font-size: 12px; cursor: pointer; padding: 0 2px; }
    .lnk.danger { color: #d93025; }
    .note-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .note-actions.links { gap: 10px; margin-top: 8px; align-items: center; }
    .solo-toggle {
      display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #8a7a3a;
      cursor: pointer; user-select: none; margin-right: auto;
    }
    .solo-toggle.on { color: #1a7f37; font-weight: 600; }
    .solo-toggle input { margin: 0; cursor: pointer; accent-color: #1a7f37; }
    #actionbar .solo-toggle { margin-right: 0; font-size: 13px; color: #3c3c43; }

    .btn {
      border: 1px solid #d1d1d6; background: #fff; border-radius: 16px; padding: 5px 14px;
      font-size: 13px; cursor: pointer; color: #1c1c1e; white-space: nowrap;
    }
    .btn:hover { background: #f2f2f7; }
    .btn.primary { background: #0B84FE; border-color: #0B84FE; color: #fff; }
    .btn.primary:hover { background: #0a74e0; }
    .btn:disabled { opacity: .4; cursor: default; }

    #actionbar {
      display: none;
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      width: min(620px, calc(100vw - 32px));
      background: #fff; border: 1px solid #e5e5ea; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
      padding: 10px 12px; z-index: 500;
    }
    #actionbar.open { display: block; }
    #actionbar .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #actionbar .row .spacer { flex: 1; }
    #sel-count { font-size: 13px; color: #3c3c43; }

    #notes-list h2 { margin-top: 10px; border-top: 1px solid #e5e5ea; padding-top: 14px; }
    .note-item {
      margin: 1px 6px; padding: 6px 8px 6px 10px; border-radius: 8px; cursor: pointer;
      border-left: 3px solid var(--g); font-size: 12px; color: #3c3c43;
    }
    .note-item:hover { background: #f2f2f7; }
    .note-item .when { color: #8e8e93; font-size: 11px; }
    .note-item .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: #1c1c1e; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 600;
    }
    #toast.show { opacity: .94; pointer-events: auto; }
    .toast-action { background: none; border: none; color: #6ab7ff; font: inherit; font-weight: 600; cursor: pointer; margin-left: 10px; }
    #set-switch { display: inline-flex; }
    .set-btn { border-radius: 0; }
    .set-btn:first-child { border-radius: 16px 0 0 16px; }
    .set-btn:last-child { border-radius: 0 16px 16px 0; margin-left: -1px; }
    .set-btn.active { background: #5b3fd6; border-color: #5b3fd6; color: #fff; }
    #annotate-btn.on { background: #0B84FE; color: #fff; border-color: #0B84FE; }
  </style>
</head>
<body class="notes-page">

<div id="sidebar">
  <h2>People</h2>
  <div class="person-item active" data-name="" onclick="setFilter('')">
    <span class="person-dot" style="background:#8e8e93"></span>
    Everyone
  </div>
</div>

<div id="main">
  <div id="toolbar">
    <h1>🍺 One Beer at a Time</h1>
    <div>local mac mini data, remember to sync!</div>
    <button id="annotate-btn" class="btn" onclick="toggleAnnotate()" title="Select messages to group (A)">✎ Annotate</button>
    <span id="set-switch" title="Independent annotation passes"></span>
    <a id="export-btn" class="btn" style="text-decoration:none" href="#" download>⬇ Export CSV</a>
    <input id="search" type="text" placeholder="Search messages…">
  </div>
  <div id="chat-tabs"></div>
  <div id="load-older" class="hidden">
    <button>Load older messages</button>
  </div>
  <div id="chat-feed">
    <div id="status">Loading…</div>
  </div>
</div>

<div id="actionbar">
  <div class="row" style="margin-top:0">
    <span id="sel-count"></span>
    <span class="spacer"></span>
    <button class="btn" id="ungroup-sel" onclick="removeSelectedFromGroups()">Remove from group</button>
    <button class="btn" onclick="clearSelection()">Clear</button>
  </div>
  <div class="row"><textarea id="new-note" placeholder="Note for this group (optional)… ⌘↵ to save"></textarea></div>
  <div class="row">
    <span class="spacer"></span>
    <label class="solo-toggle"><input type="checkbox" id="new-solo"> Solo</label>
    <button class="btn primary" id="group-btn" onclick="createGroup()">Group</button>
  </div>
</div>

<div id="toast"></div>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const API = window.location.origin.includes('localhost') ? 'http://localhost:8000' : '';
  const PAGE = 100;

  const NAMES = ['Avi','Cole','Hunter','Jacob','Joseph','Kacper','Liam','Lucas','Marek','Miggy','Owen'];
  const getHue = name => { const i = NAMES.indexOf(name); return i >= 0 ? i * 28 : 308; };
  const avatarStyle = name => `background:hsl(${getHue(name)},65%,50%)`;

  const CHAT_LABELS = {
    'chat313739884378608609': 'Main',
    'chat247636595391927399': 'OG',
    'chat26176758262309627':  'OG (oldest)',
  };

  const state = {
    offset: 0,
    total: 0,
    allMessages: [],   // stored ascending (oldest first)
    filter: { name: '', search: '' },
    chatId: null,
  };

  // ── Fetch ────────────────────────────────────────────────────────────────

  async function autoLoadAll() {
    state.offset = 0;
    state.allMessages = [];

    const statusEl = document.getElementById('status');

    do {
      let url = `${API}/messages?limit=${PAGE}&offset=${state.offset}&show_reactions=false`;
      if (state.filter.name)   url += `&name=${encodeURIComponent(state.filter.name)}`;
      if (state.filter.search) url += `&search=${encodeURIComponent(state.filter.search)}`;
      if (state.chatId)        url += `&chat_id=${encodeURIComponent(state.chatId)}`;

      let data;
      try {
        const res = await fetch(url);
        data = await res.json();
      } catch (e) {
        if (statusEl) statusEl.textContent = 'Could not reach API — is the server running?';
        console.error('fetch failed', e);
        return;
      }

      const incoming = [...data.messages].reverse();
      state.allMessages = [...incoming, ...state.allMessages];
      state.total = data.total;
      state.offset += data.messages.length;

      if (statusEl) statusEl.textContent = `Loading… ${state.allMessages.length} / ${state.total}`;
    } while (state.allMessages.length < state.total);

    const feed = document.getElementById('chat-feed');
    if (statusEl) statusEl.remove();
    await loadGroups();
    feed.innerHTML = '';
    lineEls.clear();
    renderMessageBlock(feed, state.allMessages, 'append');
    placeNoteCards();
    renderNotesList();
    document.getElementById('load-older').classList.add('hidden');
    feed.scrollTop = 0;
  }


  // ── Render ───────────────────────────────────────────────────────────────

  function renderMessageBlock(container, messages, mode) {
    let lastDate = null;
    let lastSender = null;

    messages.forEach(msg => {
      const dateLabel = formatDateLabel(msg.sent_at);
      if (dateLabel !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.textContent = dateLabel;
        container.appendChild(sep);
        lastDate = dateLabel;
        lastSender = null;
      }

      const showName = !msg.is_from_me && msg.name !== lastSender;
      const showAvatar = !msg.is_from_me;
      lastSender = msg.name;

      container.appendChild(buildLine(msg, showName, showAvatar));
    });
  }

  function buildMessageEl(msg, showName, showAvatar) {
    const row = document.createElement('div');
    row.className = `msg-row ${msg.is_from_me ? 'from-me' : 'from-them'}`;

    // avatar
    if (!msg.is_from_me) {
      const av = document.createElement('div');
      av.className = 'avatar' + (showAvatar ? '' : ' hidden');
      av.style.cssText = avatarStyle(msg.name);
      av.textContent = msg.name[0].toUpperCase();
      row.appendChild(av);
    }

    // bubble wrap
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    if (showName && !msg.is_from_me) {
      const nameEl = document.createElement('div');
      nameEl.className = 'sender-name';
      nameEl.textContent = msg.name;
      wrap.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    // attachment(s) — a single message can carry multiple photos/videos
    if (msg.has_attachment) {
      const atts = (msg.attachments && msg.attachments.length)
        ? msg.attachments
        : [{ idx: 0, mime: msg.attachment_mime }];

      const gallery = document.createElement('div');
      gallery.className = 'attachment-gallery' + (atts.length > 1 ? ' multi' : '');

      atts.forEach(att => {
        const src = `${API}/attachment/${msg.rowid}/${att.idx}`;
        const thumb = `${API}/thumb/${msg.rowid}/${att.idx}`;
        const isVideo = (att.mime || '').startsWith('video/');
        if (isVideo) {
          const video = document.createElement('video');
          video.src = src;
          video.controls = true;
          gallery.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = thumb;                 // small cached JPEG; full size in the lightbox
          img.loading = 'lazy';
          img.alt = 'Photo';
          // a dropped/aborted load used to stick as a permanent 📷 placeholder
          img.dataset.tries = '0';
          img.onerror = function() {
            const n = +this.dataset.tries + 1;
            this.dataset.tries = n;
            if (n <= 3) { setTimeout(() => { this.src = `${thumb}?retry=${n}`; }, 400 * n); return; }
            this.replaceWith(Object.assign(document.createElement('span'), {
              className: 'attachment-placeholder', textContent: '📷 Photo'
            }));
          };
          img.onclick = e => { e.stopPropagation(); openLightbox(src); };
          gallery.appendChild(img);
        }
      });

      bubble.appendChild(gallery);
    }

    // text
    if (msg.text) {
      const textEl = document.createElement('div');
      textEl.className = 'bubble-text';
      textEl.textContent = msg.text;
      bubble.appendChild(textEl);
    }

    // if nothing at all (no text, no attachment flag)
    if (!msg.has_attachment && !msg.text) {
      const textEl = document.createElement('div');
      textEl.className = 'bubble-text attachment-placeholder';
      textEl.textContent = '(empty)';
      bubble.appendChild(textEl);
    }

    wrap.appendChild(bubble);

    const time = document.createElement('div');
    time.className = 'bubble-time';
    time.textContent = formatTime(msg.sent_at);
    wrap.appendChild(time);

    row.appendChild(wrap);
    return row;
  }

  // ── Date formatting ───────────────────────────────────────────────────────

  function parseUTC(sentAt) {
    return new Date(sentAt.replace(' ', 'T') + 'Z');
  }

  function formatDateLabel(sentAt) {
    const d = parseUTC(sentAt);
    const now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function formatTime(sentAt) {
    const d = parseUTC(sentAt);
    const now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (diffDays === 0) return timeStr;
    if (diffDays < 7) return d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + timeStr;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + timeStr;
  }

  // ── Chat tabs ─────────────────────────────────────────────────────────────

  async function buildChatTabs() {
    let chats;
    try {
      const res = await fetch(`${API}/chats`);
      chats = await res.json();
    } catch (e) {
      return;
    }

    const tabBar = document.getElementById('chat-tabs');
    tabBar.innerHTML = '';
    chats.forEach((chat, i) => {
      const btn = document.createElement('button');
      btn.className = 'chat-tab' + (i === 0 ? ' active' : '');
      btn.dataset.chatId = chat.chat_id;
      btn.textContent = `${chat.label} (${chat.message_count.toLocaleString()})`;
      btn.onclick = () => setChatFilter(chat.chat_id);
      tabBar.appendChild(btn);
    });

    if (chats.length > 0) state.chatId = chats[0].chat_id;
  }

  function setChatFilter(chatId) {
    state.chatId = chatId;
    updateExportLink();
    document.querySelectorAll('.chat-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.chatId === chatId);
    });
    autoLoadAll();
  }

  // ── Sidebar ───────────────────────────────────────────────────────────────

  function buildSidebar() {
    const sidebar = document.getElementById('sidebar');
    NAMES.forEach(name => {
      const item = document.createElement('div');
      item.className = 'person-item';
      item.dataset.name = name;
      item.onclick = () => setFilter(name);
      item.innerHTML = `
        <span class="person-dot" style="background:hsl(${getHue(name)},65%,50%)"></span>
        ${name}
      `;
      sidebar.appendChild(item);
    });
  }

  function setFilter(name) {
    state.filter.name = name;
    document.querySelectorAll('.person-item').forEach(el => {
      el.classList.toggle('active', el.dataset.name === name);
    });
    autoLoadAll();
  }

  // ── Search ────────────────────────────────────────────────────────────────

  let searchTimer = null;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.filter.search = e.target.value.trim();
      autoLoadAll();
    }, 300);
  });

  // ── Lightbox ──────────────────────────────────────────────────────────────

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });


  // ── Groups + notes ──────────────────────────────────────────────────────

  const ann = {
    on: false,
    groups: new Map(),        // id → group
    byRowid: new Map(),       // message rowid → [group id] (a multi-photo message
                              //   can hold one entry per photo)
    selected: new Set(),      // rowids
    anchor: null,             // last clicked rowid, for shift-click ranges
    editing: null,            // group id whose note is being edited
    setId: +(localStorage.getItem('annSet') || 1),   // annotation pass (1 or 2)
  };

  const SET_LABELS = { 3: 'Combined 3' };
  const setLabel = n => SET_LABELS[n] || `Annotations ${n}`;

  async function buildSetButtons() {
    let sets = [1, 2, 3];
    try {
      const rows = await (await fetch(`${API}/groups/sets`)).json();
      if (rows.length) sets = [...new Set([...rows.map(r => r.set_id), ann.setId])].sort((a, b) => a - b);
    } catch (e) { /* offline: fall back to the defaults above */ }
    const bar = document.getElementById('set-switch');
    bar.innerHTML = '';
    sets.forEach(n => {
      const b = document.createElement('button');
      b.className = 'btn set-btn' + (n === ann.setId ? ' active' : '');
      b.dataset.set = n;
      b.textContent = setLabel(n);
      b.onclick = () => setAnnotationSet(n);
      bar.appendChild(b);
    });
  }

  async function setAnnotationSet(n) {
    if (ann.setId === n) return;
    ann.setId = n;
    try { localStorage.setItem('annSet', n); } catch (e) {}
    document.querySelectorAll('.set-btn').forEach(b => b.classList.toggle('active', +b.dataset.set === n));
    updateExportLink();
    await applyGroupResponse();          // reload groups for this set, redraw tags/cards
  }

  // Display number = running drink total from the newest entry (computed server-side);
  // '?' until the note has a `person, amount, drink` line.
  const entryLabel = g => g.label ?? '?';
  const groupsOf = rowid => (ann.byRowid.get(rowid) || []).map(id => ann.groups.get(id)).filter(Boolean);
  const groupOf = rowid => groupsOf(rowid)[0];
  const groupColor = id => `hsl(${(id * 67) % 360},70%,48%)`;
  const msgByRowid = rowid => state.allMessages.find(m => m.rowid === rowid);

  async function api(method, path, body) {
    const res = await fetch(`${API}${path}`, {
      method, headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) { toast(`Couldn't save (${method} ${path} → ${res.status})`); throw new Error(res.status); }
    return res.json();
  }

  function updateExportLink() {
    const chat = state.chatId ? `&chat_id=${encodeURIComponent(state.chatId)}` : '';
    document.getElementById('export-btn').href = `${API}/groups/export.csv?set_id=${ann.setId}${chat}`;
    document.getElementById('export-btn').textContent = `⬇ Export CSV (set ${ann.setId})`;
  }

  async function loadGroups() {
    updateExportLink();
    const qs = `?set_id=${ann.setId}` + (state.chatId ? `&chat_id=${encodeURIComponent(state.chatId)}` : '');
    let list = [];
    try { list = await api('GET', `/groups${qs}`); } catch (e) { return; }
    ann.groups.clear(); ann.byRowid.clear();
    list.forEach(indexGroup);
  }

  function indexGroup(g) {
    ann.groups.set(g.id, g);
    g.rowids.forEach(r => {
      const ids = ann.byRowid.get(r) || [];
      if (!ids.includes(g.id)) ids.push(g.id);
      ann.byRowid.set(r, ids);
    });
  }

  // Never re-render the whole feed (13k rows): that re-triggers thousands of
  // lazy full-size photo loads and starves the browser's connections.
  // Instead patch only the lines whose membership changed, then re-place cards.
  async function applyGroupResponse() {
    const before = new Set(ann.byRowid.keys());
    await loadGroups();
    clearSelection(false);
    new Set([...before, ...ann.byRowid.keys()]).forEach(r => {
      const el = lineEls.get(r);
      if (el) decorateLine(el, r);
    });
    placeNoteCards();
    renderNotesList();
    syncSelection();
  }

  const lineEls = new Map();   // rowid → .line element

  function decorateLine(line, rowid) {
    const gs = groupsOf(rowid);
    line.classList.toggle('in-group', !!gs.length);
    if (gs.length) line.style.setProperty('--g', groupColor(gs[0].id));
    else line.style.removeProperty('--g');
    // scope to the message column: note cards in this line's note cell carry
    // .group-tag badges of their own and must not be stripped
    const msgCell = line.querySelector('.line-msg');
    msgCell.querySelectorAll('.group-tag').forEach(t => t.remove());
    const time = msgCell.querySelector('.bubble-time');
    gs.forEach(g => {                      // one tag per entry on this message
      const tag = document.createElement('span');
      tag.className = 'group-tag';
      tag.style.background = groupColor(g.id);
      tag.textContent = `#${entryLabel(g)}`;
      time.appendChild(tag);
    });
  }

  function placeNoteCards() {
    document.querySelectorAll('.note-card').forEach(c => c.remove());
    const pos = new Map(state.allMessages.map((m, i) => [m.rowid, i]));
    ann.groups.forEach(g => {
      // card goes in the note cell of the group's first *rendered* message
      const first = g.rowids.filter(r => lineEls.has(r)).sort((a, b) => pos.get(a) - pos.get(b))[0];
      if (first != null) lineEls.get(first).querySelector('.line-note').appendChild(buildNoteCard(g));
    });
  }

  function redrawCard(id) {
    const card = document.getElementById(`note-${id}`);
    const g = ann.groups.get(id);
    if (card && g) card.replaceWith(buildNoteCard(g));
  }

  function buildLine(msg, showName, showAvatar) {
    const line = document.createElement('div');
    line.className = 'line';
    line.dataset.rowid = msg.rowid;
    if (ann.selected.has(msg.rowid)) line.classList.add('selected');
    const cell = document.createElement('div');
    cell.className = 'line-msg';
    cell.appendChild(buildMessageEl(msg, showName, showAvatar));
    const noteCell = document.createElement('div');
    noteCell.className = 'line-note';
    line.append(cell, noteCell);
    decorateLine(line, msg.rowid);
    lineEls.set(msg.rowid, line);
    line.addEventListener('click', e => {
      if (!ann.on) return;
      if (e.target.closest('video, .line-note')) return;
      e.preventDefault();
      toggleSelect(msg.rowid, e.shiftKey);
    });
    return line;
  }

  function buildNoteCard(g) {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.id = `note-${g.id}`;
    card.style.setProperty('--g', groupColor(g.id));

    const head = document.createElement('div');
    head.className = 'note-head';
    const first = msgByRowid(g.rowids[0]);
    head.innerHTML = `<span class="group-tag" style="margin:0">#${entryLabel(g)}</span>
      <span>📝 ${g.rowids.length} message${g.rowids.length === 1 ? '' : 's'}${first ? ' · ' + formatTime(first.sent_at) : ''}</span>
`;
    card.appendChild(head);

    const mk = (label, fn, cls = '') => {
      const b = document.createElement('button');
      b.className = 'lnk ' + cls; b.textContent = label;
      b.onclick = e => { e.stopPropagation(); fn(); };
      return b;
    };

    if (ann.editing === g.id) {
      const ta = document.createElement('textarea');
      ta.value = g.note || '';
      ta.placeholder = 'Write a note… ⌘↵ to save, Esc to cancel';
      const save = async () => {
        await api('PATCH', `/groups/${g.id}`, { note: ta.value });
        ann.editing = null; await applyGroupResponse();
      };
      const cancel = () => { ann.editing = null; redrawCard(g.id); };
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
        if (e.key === 'Escape') { e.stopPropagation(); cancel(); }
      });
      card.appendChild(ta);
      const actions = document.createElement('div');
      actions.className = 'note-actions';
      const s = document.createElement('button'); s.className = 'btn primary'; s.textContent = 'Save'; s.onclick = save;
      const c = document.createElement('button'); c.className = 'btn'; c.textContent = 'Cancel'; c.onclick = cancel;
      actions.append(c, s);
      card.appendChild(actions);
      setTimeout(() => ta.focus(), 0);
    } else {
      const body = document.createElement('div');
      body.className = 'note-body' + (g.note ? '' : ' empty');
      body.textContent = g.note || 'No note yet — click Edit to add one';
      body.ondblclick = () => { ann.editing = g.id; redrawCard(g.id); };
      card.appendChild(body);
      const acts = document.createElement('div');
      acts.className = 'note-actions links';
      const solo = document.createElement('label');
      solo.className = 'solo-toggle' + (g.solo ? ' on' : '');
      solo.title = 'Photo is a true solo';
      solo.innerHTML = `<input type="checkbox" ${g.solo ? 'checked' : ''}> Solo`;
      solo.querySelector('input').onchange = async e => {
        const updated = await api('PATCH', `/groups/${g.id}`, { solo: e.target.checked });
        g.solo = updated.solo; solo.classList.toggle('on', !!g.solo);
      };
      solo.onclick = e => e.stopPropagation();
      acts.appendChild(solo);
      acts.appendChild(mk(`+ Add ${ann.selected.size} selected`, async () => {
        await api('PATCH', `/groups/${g.id}`, { add_rowids: [...ann.selected] }); await applyGroupResponse();
      }, 'add-sel'));
      acts.appendChild(mk('Edit', () => { ann.editing = g.id; redrawCard(g.id); }));
      acts.appendChild(mk('Select', () => { if (!ann.on) toggleAnnotate(); g.rowids.forEach(r => ann.selected.add(r)); syncSelection(); }));
      // one click deletes; the toast offers an undo instead of a confirm step
      acts.appendChild(mk('Ungroup', async () => {
        const undo = { set_id: ann.setId, chat_id: g.chat_id, rowids: [...g.rowids], note: g.note, solo: !!g.solo };
        await api('DELETE', `/groups/${g.id}`);
        await applyGroupResponse();
        toast(`Ungrouped #${entryLabel(g)}`, 'Undo', async () => {
          await api('POST', '/groups', undo);
          await applyGroupResponse();
        });
      }, 'danger'));
      card.appendChild(acts);
    }
    return card;
  }

  function toggleAnnotate() {
    ann.on = !ann.on;
    document.body.classList.toggle('annotating', ann.on);
    document.getElementById('annotate-btn').classList.toggle('on', ann.on);
    if (!ann.on) clearSelection();
  }

  function toggleSelect(rowid, range) {
    if (range && ann.anchor != null) {
      const ids = [...document.querySelectorAll('.line')].map(el => +el.dataset.rowid);
      let a = ids.indexOf(ann.anchor), b = ids.indexOf(rowid);
      if (a > b) [a, b] = [b, a];
      ids.slice(a, b + 1).forEach(r => ann.selected.add(r));
    } else if (ann.selected.has(rowid)) {
      ann.selected.delete(rowid);
    } else {
      ann.selected.add(rowid);
    }
    ann.anchor = rowid;
    syncSelection();
  }

  function clearSelection(sync = true) {
    ann.selected.clear();
    ann.anchor = null;
    document.getElementById('new-note').value = '';
    document.getElementById('new-solo').checked = false;
    if (sync) syncSelection();
  }

  let shownSelected = new Set();
  function syncSelection() {
    // only touch lines whose state changed (15k lines in the feed)
    new Set([...shownSelected, ...ann.selected]).forEach(r => {
      lineEls.get(r)?.classList.toggle('selected', ann.selected.has(r));
    });
    shownSelected = new Set(ann.selected);
    const n = ann.selected.size;
    document.body.classList.toggle('has-selection', n > 0);
    document.querySelectorAll('.note-card .add-sel').forEach(b => { b.textContent = `+ Add ${n} selected`; });
    const bar = document.getElementById('actionbar');
    bar.classList.toggle('open', n > 0);
    const grouped = [...ann.selected].filter(r => (ann.byRowid.get(r) || []).length).length;
    document.getElementById('sel-count').textContent =
      `${n} selected` + (grouped ? ` · ${grouped} already grouped (grouping moves them)` : '');
    document.getElementById('ungroup-sel').style.display = grouped ? '' : 'none';
  }

  async function createGroup() {
    if (!ann.selected.size) return;
    await api('POST', '/groups', {
      set_id: ann.setId, chat_id: state.chatId, rowids: [...ann.selected],
      note: document.getElementById('new-note').value.trim(),
      solo: document.getElementById('new-solo').checked,
    });
    await applyGroupResponse();
  }

  async function removeSelectedFromGroups() {
    const byGroup = new Map();
    ann.selected.forEach(r => (ann.byRowid.get(r) || []).forEach(gid => {
      if (!byGroup.has(gid)) byGroup.set(gid, []);
      byGroup.get(gid).push(r);
    }));
    for (const [gid, rowids] of byGroup) await api('PATCH', `/groups/${gid}`, { remove_rowids: rowids });
    await applyGroupResponse();
  }

  function renderNotesList() {
    let box = document.getElementById('notes-list');
    if (!box) {
      box = document.createElement('div');
      box.id = 'notes-list';
      document.getElementById('sidebar').appendChild(box);
    }
    const groups = [...ann.groups.values()].sort((a, b) => a.rowids[0] - b.rowids[0]);
    box.innerHTML = `<h2>Notes (${groups.length})</h2>`;
    groups.forEach(g => {
      const first = msgByRowid(g.rowids[0]);
      const item = document.createElement('div');
      item.className = 'note-item';
      item.style.setProperty('--g', groupColor(g.id));
      item.innerHTML = `<div class="when"></div><div class="txt"></div>`;
      item.querySelector('.when').textContent = `#${entryLabel(g)} · ${first ? formatTime(first.sent_at) : 'hidden by filter'}`;
      item.querySelector('.txt').textContent = g.note || '(no note)';
      item.onclick = () => jumpToGroup(g.id);
      box.appendChild(item);
    });
  }

  function toast(msg, actionLabel, fn) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    if (actionLabel) {
      const b = document.createElement('button');
      b.className = 'toast-action';
      b.textContent = actionLabel;
      b.onclick = async () => { el.classList.remove('show'); await fn(); };
      el.appendChild(b);
    }
    el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 6000);
  }

  function jumpToGroup(id) {
    const card = document.getElementById(`note-${id}`);
    if (!card) return toast('That group is hidden by the current person/search filter.');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }

  document.getElementById('new-note').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); createGroup(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'a' || e.key === 'A') toggleAnnotate();
    if (e.key === 'Escape' && ann.selected.size) clearSelection();
    if (e.key === 'g' && ann.selected.size) createGroup();
  });

  // ── Init ──────────────────────────────────────────────────────────────────

  async function init() {
    buildSidebar();
    await buildChatTabs();
    await buildSetButtons();
    updateExportLink();
    autoLoadAll();
  }
  init();
</script>
</body>
</html>
