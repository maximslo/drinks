<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>One Drink At A Time</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1c1c1e;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #treemap {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    .tile {
      position: absolute;
      left: 0; top: 0;
      overflow: hidden;
      padding: 5px 6px;
      border-radius: 3px;
      will-change: transform;
      contain: layout style paint;
    }

    .tile-name {
      font-weight: 600;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-count {
      font-weight: 400;
      font-size: 8px;
      line-height: 1.3;
      margin-top: 1px;
      opacity: 0.5;
    }

    /* Legend */
    .legend-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      background: rgba(28,28,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.32);
      cursor: pointer;
      user-select: none;
      padding: 8px 10px;
      flex: 1 1 auto;
      min-width: 0;
      transition: background 0.2s, color 0.2s;
    }

    .legend-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.65); }
    .legend-item.active { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }

    .legend-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
    .legend-lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-sub { opacity: 0.4; font-size: 9px; }

    /* HUD */
    .hud {
      position: fixed;
      top: 14px; right: 14px;
      z-index: 20;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      line-height: 1.7;
      color: rgba(255,255,255,0.13);
      text-align: right;
      pointer-events: none;
    }
    .hud-val { color: rgba(255,255,255,0.28); font-weight: 600; }

    /* Nav */
    .top-nav {
      position: fixed;
      top: 14px; left: 14px;
      z-index: 30;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.75); }

    @media (max-width: 600px) {
      .legend-item { padding: 10px 4px; flex: 1 1 25%; }
      .legend-lbl  { font-size: 8px; }
      .nav-btn .nav-label { display: none; }
      .nav-btn { padding: 6px 10px; }
    }
  </style>
</head>
<body>

<div id="treemap"></div>

<div class="hud" id="hud">
  <div><span class="hud-val" id="hud-tiles">0</span> tiles</div>
  <div><span class="hud-val" id="hud-ms">0.00</span>ms/frame</div>
</div>

<div class="top-nav">
  <a class="nav-btn" href="/ui/leaderboard.html">
    &#8592; <span class="nav-label">Leaderboard</span>
  </a>
</div>

<div class="legend-bar" id="legend-bar"></div>

<script type="module">
  import * as d3 from 'https://esm.sh/d3@7'

  // ── Colors ────────────────────────────────────────────────────────

  const CATS = {
    Beer:     { bg: '#f3d2a1', bgHover: '#e5b96a', fg: 'rgba(0,0,0,0.65)', accent: '#c87820', unlabeled: 954 },
    Cocktail: { bg: '#aacae8', bgHover: '#76aede', fg: 'rgba(0,0,0,0.65)', accent: '#2e72b8', unlabeled: 561 },
    Shot:     { bg: '#f0beb9', bgHover: '#e28278', fg: 'rgba(0,0,0,0.65)', accent: '#c04040', unlabeled: 102 },
    Wine:     { bg: '#d2b9e3', bgHover: '#b88ed4', fg: 'rgba(0,0,0,0.65)', accent: '#8040b8', unlabeled:  46 },
    Seltzer:  { bg: '#a7d6b9', bgHover: '#72c090', fg: 'rgba(0,0,0,0.65)', accent: '#2ea060', unlabeled:  82 },
    Cider:    { bg: '#a6dbdb', bgHover: '#72bebe', fg: 'rgba(0,0,0,0.65)', accent: '#288888', unlabeled:   0 },
    Other:    { bg: '#ccc9c4', bgHover: '#aea9a4', fg: 'rgba(0,0,0,0.65)', accent: '#6a6560', unlabeled:  17 },
  }

  const TYPE_ORDER = ['Beer', 'Cocktail', 'Shot', 'Wine', 'Seltzer', 'Cider', 'Other']

  // ── Data (named drinks only — unlabeled totals shown in legend) ───

  const DRINK_DATA = [
    { type: 'Beer', children: [
      { name: 'Corona',         count: 287 },
      { name: 'Coors Light',    count: 279 },
      { name: 'Guinness',       count: 168 },
      { name: 'Bud Light',      count: 148 },
      { name: 'Modelo',         count: 117 },
      { name: 'Bapple',         count: 100 },
      { name: 'Michelob Ultra', count:  89 },
      { name: 'Kona',           count:  64 },
      { name: 'Tsingtao',       count:  57 },
      { name: 'PBR',            count:  42 },
      { name: 'Miller Lite',    count:  38 },
      { name: 'Busch',          count:  38 },
      { name: 'Bintang',        count:  30 },
      { name: 'Sapporo',        count:  21 },
      { name: 'Singha',         count:  21 },
    ]},
    { type: 'Cocktail', children: [
      { name: 'Margarita',        count: 91 },
      { name: 'Gin & Tonic',      count: 68 },
      { name: 'Cutwater',         count: 58 },
      { name: 'Espresso Martini', count: 42 },
      { name: 'Vodka Redbull',    count: 29 },
      { name: 'Rum & Coke',       count: 27 },
      { name: 'Spritz',           count: 24 },
      { name: 'Long Island',      count: 20 },
      { name: 'Vodka Soda',       count: 20 },
      { name: 'Moscow Mule',      count: 18 },
      { name: 'Jagerbomb',        count: 13 },
      { name: 'Mojito',           count: 12 },
      { name: 'Vodka Cran',       count: 11 },
      { name: 'Smirnoff Ice',     count: 10 },
    ]},
    { type: 'Shot', children: [
      { name: 'Tequila',    count: 173 },
      { name: 'Vodka',      count:  76 },
      { name: 'Whiskey',    count:  74 },
      { name: 'Fireball',   count:  43 },
      { name: 'Jello Shot', count:  31 },
      { name: 'Jäger',      count:  13 },
      { name: 'Limoncello', count:  10 },
      { name: 'Green Tea',  count:  10 },
      { name: 'Bourbon',    count:   7 },
      { name: 'Gin',        count:   7 },
    ]},
    { type: 'Wine', children: [
      { name: 'Red Wine',   count: 192 },
      { name: 'White Wine', count: 174 },
      { name: 'Sangria',    count:  40 },
      { name: 'Rosé',       count:  19 },
      { name: 'Sake',       count:  18 },
    ]},
    { type: 'Seltzer', children: [
      { name: 'Downeast',      count: 189 },
      { name: 'Strong Zero',   count:  44 },
      { name: 'High Noon',     count:  30 },
      { name: 'Angry Orchard', count:  25 },
      { name: 'Bold Rock',     count:  21 },
      { name: 'Somersby',      count:   9 },
    ]},
    { type: 'Other', children: [
      { name: 'Soju',        count: 60 },
      { name: 'Twisted Tea', count: 10 },
    ]},
    { type: 'Cider', children: [
      { name: 'Cider', count: 21 },
    ]},
  ]

  // ── D3 Treemap ────────────────────────────────────────────────────
  // treemapResquarify preserves topology between frames — tiles never
  // swap rows, only sizes change. Gives the "frozen rows" stability.

  const treemapLayout = d3.treemap()
    .tile(d3.treemapResquarify)
    .paddingInner(d => d.depth === 1 ? 3 : 2)
    .paddingOuter(3)
    .round(true)

  // ── State ─────────────────────────────────────────────────────────

  const treemapEl = document.getElementById('treemap')
  const legendBar  = document.getElementById('legend-bar')

  let mouseX = -9999, mouseY = -9999
  const CURSOR_RADIUS = 260
  const EXPAND_FACTOR = 3.5
  const LERP = 0.10

  let activeCat = null
  let tiles  = []
  let root   = null

  // ── Init ──────────────────────────────────────────────────────────

  function init() {
    // Legend bar
    for (const type of TYPE_ORDER) {
      const cat = CATS[type]
      const total = DRINK_DATA.find(d => d.type === type)?.children.reduce((s,c) => s+c.count, 0) ?? 0
      const labeled = total
      const full    = labeled + cat.unlabeled
      const item = document.createElement('div')
      item.className = 'legend-item'
      item.dataset.type = type
      item.innerHTML = `
        <span class="legend-dot" style="background:${cat.accent}"></span>
        <span class="legend-lbl">${type} <span class="legend-sub">${full.toLocaleString()}${cat.unlabeled ? ` (+${cat.unlabeled.toLocaleString()} unlabeled)` : ''}</span></span>`
      const isTouch = () => navigator.maxTouchPoints > 0
      item.addEventListener('mouseenter', () => { if (!isTouch()) { activeCat = type; syncLegend() } })
      item.addEventListener('mouseleave', () => { if (!isTouch()) { activeCat = null;  syncLegend() } })
      item.addEventListener('click',      () => { activeCat = activeCat === type ? null : type; syncLegend() })
      legendBar.appendChild(item)
    }

    // Build hierarchy — sort once by base count so topology is stable
    const legendH = legendBar.getBoundingClientRect().height
    root = d3.hierarchy({ children: DRINK_DATA })
      .sum(d => d.count || 0)
      .sort((a, b) => b.value - a.value)

    treemapLayout.size([window.innerWidth, window.innerHeight - legendH])
    treemapLayout(root)

    // Create a div per leaf, keep reference to the D3 leaf node
    tiles = root.leaves().map(leaf => {
      const d    = leaf.data
      const type = leaf.parent.data.type
      const cat  = CATS[type]

      const el = document.createElement('div')
      el.className = 'tile'
      el.dataset.type = type
      el.style.backgroundColor = cat.bg
      el.innerHTML = `
        <div class="tile-name"  style="color:${cat.fg}">${d.name}</div>
        <div class="tile-count" style="color:${cat.fg}">${d.count.toLocaleString()}</div>`
      treemapEl.appendChild(el)

      const x = leaf.x0, y = leaf.y0
      const w = leaf.x1 - leaf.x0, h = leaf.y1 - leaf.y0
      el.style.transform = `translate(${x}px,${y}px)`
      el.style.width  = w + 'px'
      el.style.height = h + 'px'

      return {
        leaf, data: d, type, el, cat,
        _w: d.count,
        rx: x, ry: y, rw: w, rh: h,
        currentOpacity: 1,
        _hoverLevel: -1, _tier: -1, _pop: -1,
      }
    })

    document.getElementById('hud-tiles').textContent = tiles.length
  }

  function syncLegend() {
    legendBar.querySelectorAll('.legend-item').forEach(el =>
      el.classList.toggle('active', el.dataset.type === activeCat))
  }

  // ── Mouse / Touch ─────────────────────────────────────────────────

  document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY })
  document.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999 })

  let touchTimer = null
  document.addEventListener('touchstart', e => {
    if (e.target.closest('.legend-bar') || e.target.closest('.top-nav')) return
    mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY
    clearTimeout(touchTimer)
  }, { passive: true })
  document.addEventListener('touchmove', e => {
    if (e.target.closest('.legend-bar')) return
    mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY
    e.preventDefault()
  }, { passive: false })
  document.addEventListener('touchend', () => {
    clearTimeout(touchTimer)
    touchTimer = setTimeout(() => { mouseX = -9999; mouseY = -9999 }, 800)
  })

  // ── Render Loop ───────────────────────────────────────────────────

  function tick() {
    const t0 = performance.now()
    const vw = window.innerWidth
    const vh = window.innerHeight - legendBar.getBoundingClientRect().height

    // Step 1 — lerp each tile's weight toward cursor-expanded target
    const weightMap = {}
    for (const tile of tiles) {
      const cx = tile.rx + tile.rw / 2
      const cy = tile.ry + tile.rh / 2
      const dist = Math.sqrt((mouseX - cx) ** 2 + (mouseY - cy) ** 2)

      let expand = 1
      if (dist < CURSOR_RADIUS) {
        const force = 1 - dist / CURSOR_RADIUS
        expand = 1 + force * force * EXPAND_FACTOR
      }
      if (activeCat !== null) {
        expand = tile.type === activeCat
          ? Math.max(expand, 2.5)
          : Math.min(expand, 0.5)
      }

      tile._w += (tile.data.count * expand - tile._w) * LERP
      weightMap[tile.data.name] = tile._w

      const tOp = activeCat !== null ? (tile.type === activeCat ? 1 : 0.18) : 1
      tile.currentOpacity += (tOp - tile.currentOpacity) * 0.15
    }

    // Step 2 — recompute D3 layout with updated weights
    // resquarify reuses previous row topology → no tile-swapping
    root.sum(d => weightMap[d.name] ?? 0)
    treemapLayout.size([vw, vh])(root)

    // Step 3 — lerp positions & update DOM
    for (const tile of tiles) {
      const tx = tile.leaf.x0
      const ty = tile.leaf.y0
      const tw = tile.leaf.x1 - tile.leaf.x0
      const th = tile.leaf.y1 - tile.leaf.y0

      tile.rx += (tx - tile.rx) * LERP
      tile.ry += (ty - tile.ry) * LERP
      tile.rw += (tw - tile.rw) * LERP
      tile.rh += (th - tile.rh) * LERP

      const rx = Math.round(tile.rx * 10) / 10
      const ry = Math.round(tile.ry * 10) / 10
      const rw = Math.round(tile.rw)
      const rh = Math.round(tile.rh)

      tile.el.style.transform = `translate(${rx}px,${ry}px)`
      tile.el.style.width  = rw + 'px'
      tile.el.style.height = rh + 'px'

      const opi = Math.round(tile.currentOpacity * 100)
      if (tile._pop !== opi) { tile.el.style.opacity = tile.currentOpacity; tile._pop = opi }

      // Hover color (lerp bg toward brighter shade near cursor)
      const hdist = Math.sqrt((mouseX - (tile.rx + tile.rw / 2)) ** 2 + (mouseY - (tile.ry + tile.rh / 2)) ** 2)
      const intensity  = hdist < CURSOR_RADIUS ? (1 - hdist / CURSOR_RADIUS) : 0
      const hoverLevel = Math.round(intensity * 5)
      if (tile._hoverLevel !== hoverLevel) {
        if (hoverLevel > 0) {
          const f = hoverLevel / 5
          tile.el.style.backgroundColor = lerpColor(tile.cat.bg, tile.cat.bgHover, f)
          tile.el.style.boxShadow = `0 ${Math.round(f*6)}px ${Math.round(f*18)}px rgba(0,0,0,${(f*0.18).toFixed(2)})`
          tile.el.style.zIndex = 10 + Math.round(f * 10)
        } else {
          tile.el.style.backgroundColor = tile.cat.bg
          tile.el.style.boxShadow = ''
          tile.el.style.zIndex = '0'
        }
        tile._hoverLevel = hoverLevel
      }

      // Text tier based on rendered area
      const area = rw * rh
      let tier = 0
      if      (area >= 16000) tier = 3
      else if (area >=  4500) tier = 2
      else if (area >=   700) tier = 1

      if (tile._tier !== tier || tier === 3) {
        const nameEl  = tile.el.querySelector('.tile-name')
        const countEl = tile.el.querySelector('.tile-count')

        if (tier === 0) {
          nameEl.style.display = 'none'; countEl.style.display = 'none'
        } else if (tier === 1) {
          nameEl.style.display = ''; nameEl.style.fontSize = '7px'
          countEl.style.display = 'none'
        } else if (tier === 2) {
          const sz = Math.min(12, 9 + (area - 4500) / 5000)
          nameEl.style.display = ''; nameEl.style.fontSize = sz + 'px'
          countEl.style.display = ''; countEl.style.fontSize = (sz - 2) + 'px'
        } else {
          const sz = Math.min(14, 11 + area / 25000)
          nameEl.style.display = ''; nameEl.style.fontSize = sz + 'px'
          countEl.style.display = ''; countEl.style.fontSize = (sz - 1) + 'px'
        }
        tile._tier = tier
      }
    }

    document.getElementById('hud-ms').textContent = (performance.now() - t0).toFixed(2)
    requestAnimationFrame(tick)
  }

  function lerpColor(a, b, t) {
    const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16)
    const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16)
    return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`
  }

  // ── Boot ──────────────────────────────────────────────────────────

  init()
  requestAnimationFrame(tick)

  let resizeTimer
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => {
      for (const tile of tiles) tile._w = tile.data.count
    }, 150)
  })
</script>
</body>
</html>
