<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>One Drink At A Time</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1c1c1e;
      color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ════════════════════════════ TREEMAP SECTION ════════════════════════════ */

    #treemap-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    #treemap {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    .tile {
      position: absolute;
      left: 0; top: 0;
      overflow: hidden;
      padding: 5px 6px;
      border-radius: 3px;
      will-change: transform;
      contain: layout style paint;
    }

    .tile-name {
      font-weight: 600;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-count {
      font-weight: 400;
      font-size: 8px;
      line-height: 1.3;
      margin-top: 1px;
      opacity: 0.5;
    }

    .tile-img {
      position: absolute;
      top: 50%; left: 50%;
      width: 256px; height: 256px;
      object-fit: contain;
      opacity: 0.85;
      pointer-events: none;
      user-select: none;
      transform: translate(-50%, -50%) scale(0);
    }

    /* Legend */
    .legend-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      background: rgba(28,28,30,0.97);
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.32);
      cursor: pointer;
      user-select: none;
      padding: 8px 10px;
      flex: 1 1 auto;
      min-width: 0;
      transition: background 0.2s, color 0.2s;
    }

    .legend-item:hover  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.65); }
    .legend-item.active { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }

    .legend-dot  { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
    .legend-lbl  { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-sub  { opacity: 0.4; font-size: 9px; }

    /* HUD */
    .hud {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 20;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      line-height: 1.7;
      color: rgba(255,255,255,0.13);
      text-align: right;
      pointer-events: none;
    }
    .hud-val { color: rgba(255,255,255,0.28); font-weight: 600; }

    /* Scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 48px; left: 0; right: 0;
      z-index: 15;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.18);
      pointer-events: none;
      animation: hintpulse 3s ease-in-out infinite;
    }
    @keyframes hintpulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50%       { opacity: 1;   transform: translateY(3px); }
    }

    @media (max-width: 600px) {
      .legend-bar  { flex-wrap: nowrap; overflow-x: auto; }
      .legend-item { padding: 8px 6px; flex: 1 1 0; min-width: 0; }
      .legend-lbl  { font-size: 8px; }
      .legend-sub  { display: none; }
    }

    /* ════════════════════════════ CANS SECTION ════════════════════════════ */

    #cans-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 52px 24px 80px;
    }

    #cans-section h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .section-subtitle {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 6px;
    }

    #cans-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2c2c2e;
    }

    .cans-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #ebebf0;
    }

    .cans-legend-can {
      width: 8px;
      height: 14px;
      flex-shrink: 0;
    }

    #cans-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 16px;
      margin-top: 28px;
    }

    .person-card  {
      min-width: 0;
      transform: translateZ(0);
      will-change: transform;
    }

    .person-avatar {
      width: 96px;
      height: 96px;
      object-fit: cover;
      object-position: top center;
      display: block;
      margin-bottom: 8px;
      filter: grayscale(100%) contrast(1.05);
    }

    .person-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-specialty {
      font-size: 10px;
      font-weight: 500;
      margin-top: 2px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .person-total {
      font-size: 10px;
      color: #636366;
      margin-bottom: 8px;
    }

    .cans-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-content: flex-start;
    }

    .can-icon {
      display: block;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .can-icon:hover { opacity: 0.72; }

    @media (max-width: 600px) {
      #cans-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

const TYPE_ORDER = ['Beer', 'Cocktail', 'Shot', 'Wine', 'Cider', 'Seltzer', 'Other']

const OPENMOJI = 'https://cdn.jsdelivr.net/npm/openmoji@15.0.0/color/svg/'

const MERGE_INTO = { 'Pinot Grigio': 'White Wine', 'Chardonnay': 'White Wine' }

function mergedData(data) {
  return data.map(cat => {
    const map = {}
    for (const child of cat.children) {
      const target = MERGE_INTO[child.name] ?? child.name
      if (map[target]) map[target] = { ...map[target], count: map[target].count + child.count }
      else map[target] = { ...child, name: target }
    }
    return { ...cat, children: Object.values(map) }
  })
}

// ── Treemap setup ─────────────────────────────────────────────────────────────

const treemapLayout = d3.treemap()
  .tile(d3.treemapResquarify)
  .paddingInner(d => d.depth === 1 ? 3 : 2)
  .paddingOuter(3)
  .round(true)

const sectionEl  = document.getElementById('treemap-section')
const treemapEl  = document.getElementById('treemap')
const legendBar  = document.getElementById('legend-bar')

let mouseX = -9999, mouseY = -9999   // section-relative
const CURSOR_RADIUS  = 260
const EXPAND_FACTOR  = 3.5
const LERP           = 0.10

let activeCat = null
let tiles     = []
let root      = null

function init() {
  const merged = mergedData(DRINK_DATA)

  for (const type of TYPE_ORDER) {
    const cat   = CATS[type]
    const total = merged.find(d => d.type === type)?.children.reduce((s,c) => s+c.count, 0) ?? 0
    const full  = total + cat.unlabeled
    const item  = document.createElement('div')
    item.className   = 'legend-item'
    item.dataset.type = type
    item.innerHTML = `
      <span class="legend-dot" style="background:${cat.accent}"></span>
      <span class="legend-lbl">${type} <span class="legend-sub">${full.toLocaleString()}${cat.unlabeled ? ` (+${cat.unlabeled.toLocaleString()} unlabeled)` : ''}</span></span>`
    const isTouch = () => navigator.maxTouchPoints > 0
    item.addEventListener('mouseenter', () => { if (!isTouch()) { activeCat = type; syncLegend() } })
    item.addEventListener('mouseleave', () => { if (!isTouch()) { activeCat = null;  syncLegend() } })
    item.addEventListener('click',      () => { activeCat = activeCat === type ? null : type; syncLegend() })
    legendBar.appendChild(item)
  }

  const legendH = legendBar.getBoundingClientRect().height
  const vw = sectionEl.getBoundingClientRect().width
  const vh = sectionEl.getBoundingClientRect().height - legendH

  root = d3.hierarchy({ children: merged })
    .sum(d => d.count || 0)
    .sort((a, b) => b.value - a.value)

  treemapLayout.size([vw, vh])(root)

  tiles = root.leaves().map(leaf => {
    const d   = leaf.data
    const type = leaf.parent.data.type
    const cat  = CATS[type]

    const el = document.createElement('div')
    el.className = 'tile'
    el.dataset.type = type
    el.style.backgroundColor = cat.bg
    el.innerHTML = `
      <div class="tile-name"  style="color:${cat.fg}">${d.name}</div>
      <div class="tile-count" style="color:${cat.fg}">${d.count.toLocaleString()}</div>
      <img class="tile-img" src="${iconSrc(d.name)}" decoding="async" loading="lazy">`
    treemapEl.appendChild(el)

    const x = leaf.x0, y = leaf.y0
    const w = leaf.x1 - leaf.x0, h = leaf.y1 - leaf.y0
    el.style.transform = `translate(${x}px,${y}px)`
    el.style.width  = w + 'px'
    el.style.height = h + 'px'

    return {
      leaf, data: d, type, el, cat,
      _w: d.count,
      rx: x, ry: y, rw: w, rh: h,
      currentOpacity: 1,
      _hoverLevel: -1, _tier: -1, _pop: -1,
    }
  })

  document.getElementById('hud-tiles').textContent = tiles.length
}

function syncLegend() {
  legendBar.querySelectorAll('.legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeCat))
}

// ── Mouse / touch — coordinates relative to sectionEl ────────────────────────

function updateMouse(cx, cy) {
  const rect = sectionEl.getBoundingClientRect()
  const rx = cx - rect.left
  const ry = cy - rect.top
  if (rx < 0 || rx > rect.width || ry < 0 || ry > rect.height) {
    mouseX = mouseY = -9999
  } else {
    mouseX = rx; mouseY = ry
  }
}

document.addEventListener('mousemove',  e => updateMouse(e.clientX, e.clientY))
document.addEventListener('mouseleave', () => { mouseX = mouseY = -9999 })

let touchTimer = null
document.addEventListener('touchstart', e => {
  if (e.target.closest('.legend-bar')) return
  updateMouse(e.touches[0].clientX, e.touches[0].clientY)
  clearTimeout(touchTimer)
}, { passive: true })
document.addEventListener('touchmove', e => {
  if (e.target.closest('.legend-bar')) return
  updateMouse(e.touches[0].clientX, e.touches[0].clientY)
  e.preventDefault()
}, { passive: false })
document.addEventListener('touchend', () => {
  clearTimeout(touchTimer)
  touchTimer = setTimeout(() => { mouseX = mouseY = -9999 }, 800)
})

// ── Render loop ───────────────────────────────────────────────────────────────

function lerpColor(a, b, t) {
  const ar=parseInt(a.slice(1,3),16), ag=parseInt(a.slice(3,5),16), ab=parseInt(a.slice(5,7),16)
  const br=parseInt(b.slice(1,3),16), bg=parseInt(b.slice(3,5),16), bb=parseInt(b.slice(5,7),16)
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`
}

function tick() {
  const t0 = performance.now()
  if (!root) { requestAnimationFrame(tick); return }

  const legendH = legendBar.offsetHeight
  const vw = sectionEl.getBoundingClientRect().width
  const vh = sectionEl.getBoundingClientRect().height - legendH

  const weightMap = {}
  for (const tile of tiles) {
    const cx = tile.rx + tile.rw / 2
    const cy = tile.ry + tile.rh / 2
    const dist = Math.sqrt((mouseX - cx) ** 2 + (mouseY - cy) ** 2)

    let expand = 1
    if (dist < CURSOR_RADIUS) {
      const force = 1 - dist / CURSOR_RADIUS
      expand = 1 + force * force * EXPAND_FACTOR
    }
    if (activeCat !== null) {
      expand = tile.type === activeCat
        ? Math.max(expand, 2.5)
        : Math.min(expand, 0.5)
    }

    tile._w += (tile.data.count * expand - tile._w) * LERP
    weightMap[tile.data.name] = tile._w

    const tOp = activeCat !== null ? (tile.type === activeCat ? 1 : 0.18) : 1
    tile.currentOpacity += (tOp - tile.currentOpacity) * 0.15
  }

  root.sum(d => weightMap[d.name] ?? 0)
  treemapLayout.size([vw, vh])(root)

  for (const tile of tiles) {
    const tx = tile.leaf.x0, ty = tile.leaf.y0
    const tw = tile.leaf.x1 - tile.leaf.x0, th = tile.leaf.y1 - tile.leaf.y0

    tile.rx += (tx - tile.rx) * LERP
    tile.ry += (ty - tile.ry) * LERP
    tile.rw += (tw - tile.rw) * LERP
    tile.rh += (th - tile.rh) * LERP

    const rx = Math.round(tile.rx * 10) / 10
    const ry = Math.round(tile.ry * 10) / 10
    const rw = Math.round(tile.rw)
    const rh = Math.round(tile.rh)

    tile.el.style.transform = `translate(${rx}px,${ry}px)`
    tile.el.style.width  = rw + 'px'
    tile.el.style.height = rh + 'px'

    const opi = Math.round(tile.currentOpacity * 100)
    if (tile._pop !== opi) { tile.el.style.opacity = tile.currentOpacity; tile._pop = opi }

    const hdist = Math.sqrt((mouseX - (tile.rx + tile.rw/2))**2 + (mouseY - (tile.ry + tile.rh/2))**2)
    const intensity  = hdist < CURSOR_RADIUS ? (1 - hdist / CURSOR_RADIUS) : 0
    const hoverLevel = Math.round(intensity * 5)
    if (tile._hoverLevel !== hoverLevel) {
      if (hoverLevel > 0) {
        const f = hoverLevel / 5
        tile.el.style.backgroundColor = lerpColor(tile.cat.bg, tile.cat.bgHover, f)
        tile.el.style.boxShadow = `0 ${Math.round(f*6)}px ${Math.round(f*18)}px rgba(0,0,0,${(f*0.18).toFixed(2)})`
        tile.el.style.zIndex = 10 + Math.round(f * 10)
      } else {
        tile.el.style.backgroundColor = tile.cat.bg
        tile.el.style.boxShadow = ''
        tile.el.style.zIndex = '0'
      }
      tile._hoverLevel = hoverLevel
    }

    const area = rw * rh
    let tier = 0
    if      (area >= 10000) tier = 3
    else if (area >=  2000) tier = 2
    else if (area >=   500) tier = 1

    if (tile._tier !== tier || tier === 3) {
      if (!tile._els) {
        tile._els = {
          name:  tile.el.querySelector('.tile-name'),
          count: tile.el.querySelector('.tile-count'),
          img:   tile.el.querySelector('.tile-img'),
        }
      }
      const { name: nameEl, count: countEl, img: imgEl } = tile._els

      if (tier === 0) {
        nameEl.style.display = 'none'; countEl.style.display = 'none'
        imgEl.style.transform = 'translate(-50%,-50%) scale(0)'
      } else if (tier === 1) {
        nameEl.style.display = ''; nameEl.style.fontSize = '7px'
        countEl.style.display = ''; countEl.style.fontSize = '6px'
        imgEl.style.transform = 'translate(-50%,-50%) scale(0)'
      } else if (tier === 2) {
        const sz = Math.min(12, 9 + (area - 4500) / 5000)
        nameEl.style.display = ''; nameEl.style.fontSize = sz + 'px'
        countEl.style.display = ''; countEl.style.fontSize = sz + 'px'
      } else {
        const sz = Math.min(14, 11 + area / 25000)
        nameEl.style.display = ''; nameEl.style.fontSize = sz + 'px'
        countEl.style.display = ''; countEl.style.fontSize = sz + 'px'
      }
      tile._tier = tier
    }
  }

  document.getElementById('hud-ms').textContent = (performance.now() - t0).toFixed(2)
  requestAnimationFrame(tick)
}

// ── Resize ────────────────────────────────────────────────────────────────────

let resizeTimer
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  treemapLayout.tile(d3.treemapSquarify)
  resizeTimer = setTimeout(() => {
    const legendH = legendBar.offsetHeight
    const vw = sectionEl.getBoundingClientRect().width
    const vh = sectionEl.getBoundingClientRect().height - legendH
    for (const tile of tiles) tile._w = tile.data.count
    root.sum(d => d.count || 0)
    root.each(d => { delete d._squarify })
    treemapLayout.tile(d3.treemapResquarify)
    treemapLayout.size([vw, vh])(root)
    for (const tile of tiles) {
      tile.rx = tile.leaf.x0; tile.ry = tile.leaf.y0
      tile.rw = tile.leaf.x1 - tile.leaf.x0
      tile.rh = tile.leaf.y1 - tile.leaf.y0
    }
  }, 150)
})

// ── Cans section ──────────────────────────────────────────────────────────────

const PEOPLE = [
  { name: 'Hunter', drinks: { Beer: 630, Cocktail: 151, Shot: 74,  Wine: 102, Cider: 2, Seltzer: 28,  Other: 5  } },
  { name: 'Joseph', drinks: { Beer: 440, Cocktail: 180, Shot: 61,  Wine: 40,  Cider: 5, Seltzer: 125, Other: 15 } },

  { name: 'Lucas',  drinks: { Beer: 344, Cocktail: 142, Shot: 15,  Wine: 35,  Cider: 1, Seltzer: 49,  Other: 1  } },
  { name: 'Miggy',  drinks: { Beer: 113, Cocktail: 86,  Shot: 74,  Wine: 68,  Cider: 1, Seltzer: 24,  Other: 9  } },

  { name: 'Owen',   drinks: { Beer: 52,  Cocktail: 13,  Shot: 36,  Wine: 8,   Cider: 1, Seltzer: 3,   Other: 6  } },
  { name: 'Kacper', drinks: { Beer: 72,  Cocktail: 8,   Shot: 9,   Wine: 2,   Cider: 0, Seltzer: 2,   Other: 2  } },
]

function renderCans() {
  // Legend
  const cansLegend = document.getElementById('cans-legend')
  TYPE_ORDER.forEach(type => {
    const item = document.createElement('div')
    item.className = 'cans-legend-item'
    item.innerHTML = `
      <svg class="cans-legend-can" viewBox="0 0 195 350" style="color:${CATS[type].bg}">
        <use href="#can-shape"/>
      </svg>
      <span>${type}</span>`
    cansLegend.appendChild(item)
  })

  // Grid
  const grid = document.getElementById('cans-grid')
  const CAN_W = 13, CAN_H = 23

  PEOPLE.forEach(person => {
    const total = TYPE_ORDER.reduce((s, t) => s + (person.drinks[t] || 0), 0)

    let topType = TYPE_ORDER[0], topCount = 0
    TYPE_ORDER.forEach(t => {
      if ((person.drinks[t] || 0) > topCount) { topCount = person.drinks[t]; topType = t }
    })
    const topPct = Math.round(topCount / total * 100)

    const card = document.createElement('div')
    card.className = 'person-card'

    const avatar = document.createElement('img')
    avatar.className = 'person-avatar'
    avatar.src = `avatars/${person.name.toLowerCase()}_.png`
    avatar.alt = person.name

    const nameDiv = document.createElement('div')
    nameDiv.className = 'person-name'
    nameDiv.textContent = person.name

    const specialtyDiv = document.createElement('div')
    specialtyDiv.className = 'person-specialty'
    specialtyDiv.style.color = CATS[topType].bg
    specialtyDiv.textContent = `${topPct}% ${topType}`

    const totalDiv = document.createElement('div')
    totalDiv.className = 'person-total'
    totalDiv.textContent = `${total.toLocaleString()} drinks total`

    const cansDiv = document.createElement('div')
    cansDiv.className = 'cans-container'

    TYPE_ORDER.forEach(type => {
      const count   = person.drinks[type] || 0
      const numCans = Math.round(count / 10)
      for (let i = 0; i < numCans; i++) {
        const canSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        canSvg.setAttribute('width', CAN_W)
        canSvg.setAttribute('height', CAN_H)
        canSvg.setAttribute('viewBox', '0 0 195 350')
        canSvg.classList.add('can-icon')
        canSvg.style.color = CATS[type].bg

        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use')
        use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#can-shape')
        use.setAttribute('href', '#can-shape')
        canSvg.appendChild(use)

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title')
        title.textContent = `${type} (${count} drinks)`
        canSvg.appendChild(title)

        cansDiv.appendChild(canSvg)
      }
    })

    card.appendChild(avatar)
    card.appendChild(nameDiv)
    card.appendChild(specialtyDiv)
    card.appendChild(totalDiv)
    card.appendChild(cansDiv)
    grid.appendChild(card)
  })
}

// ── Boot ──────────────────────────────────────────────────────────────────────

init()
requestAnimationFrame(tick)
renderCans()
</script>
